name: Dev

# Every push to a feature branch builds that commit's image, deploys it to dev, and smoke tests it.

on:
  push:
    branches-ignore: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  dev:
    uses: ./.github/workflows/deploy-stage.yml
    with:
      env: dev
      image_tag: ${{ github.sha }}
